<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupos Privados | World Cup Penca</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#001f54,#003b8e);
    color:white;
}

header{
    background:rgba(0,0,0,0.2);
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00bfff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0099cc;
}

.grupo{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<header>
<h1>👥 Grupos Privados</h1>
</header>

<div class="container">

<div class="card">
<h2>➕ Crear Grupo</h2>

<input type="text" id="nombreGrupo" placeholder="Nombre del grupo">

<button onclick="crearGrupo()">
Crear Grupo
</button>

<div id="grupoCreado"></div>

</div>

<div class="card">

<h2>🔑 Unirse a un Grupo</h2>

<input type="text" id="codigoGrupo" placeholder="Código del grupo">

<button onclick="unirseGrupo()">
Unirse
</button>

</div>

</div>

<script>

function crearGrupo(){

let nombre = document.getElementById("nombreGrupo").value;

if(nombre==""){
alert("Ingresa un nombre para el grupo");
return;
}

let codigo = Math.floor(100000 + Math.random()*900000);

document.getElementById("grupoCreado").innerHTML=`

<div class="grupo">

<h3>${nombre}</h3>

<p>Código del grupo:</p>

<h1>${codigo}</h1>

<p>Compártelo con tus amigos para que se unan.</p>

</div>

`;

}

</script>
<script src="script.js"></script>
</body>
</html>
