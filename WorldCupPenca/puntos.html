<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puntos | World Cup Penca</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#001f54,#003b8e);
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:rgba(0,0,0,.2);
}

.container{
    width:95%;
    max-width:1000px;
    margin:auto;
    padding:40px 0;
}

.tabla{
    background:rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#00bfff;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
}

tr:nth-child(even){
    background:rgba(255,255,255,.08);
}

tr:hover{
    background:rgba(255,255,255,.15);
}

.oro{
    color:gold;
    font-weight:bold;
}

.plata{
    color:silver;
    font-weight:bold;
}

.bronce{
    color:#cd7f32;
    font-weight:bold;
}

</style>
</head>
<body>

<header>
<h1>🏆 Ranking de la Penca</h1>
</header>

<div class="container">

<div class="tabla">

<table>

<tr>
<th>Posición</th>
<th>Usuario</th>
<th>Puntos</th>
</tr>

<tr>
<td class="oro">🥇 1</td>
<td>Matias</td>
<td>28</td>
</tr>

<tr>
<td class="plata">🥈 2</td>
<td>Juan</td>
<td>25</td>
</tr>

<tr>
<td class="bronce">🥉 3</td>
<td>Santi</td>
<td>22</td>
</tr>

<tr>
<td>4</td>
<td>Lucas</td>
<td>19</td>
</tr>

<tr>
<td>5</td>
<td>Martín</td>
<td>15</td>
</tr>

</table>

</div>

</div>

</body>
</html>
