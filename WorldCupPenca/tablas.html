<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablas | World Cup Penca</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#001f54,#003b8e);
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:rgba(0,0,0,.2);
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:30px 0;
}

.grupo{
    background:rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:center;
}

th{
    background:#00bfff;
}

tr:nth-child(even){
    background:rgba(255,255,255,.08);
}

tr:hover{
    background:rgba(255,255,255,.15);
}
</style>
</head>
<body>

<header>
<h1>📊 Tablas del Mundial 2026</h1>
</header>

<div class="container">

<div class="grupo">

<th>Selección</th>
<th>PJ</th>
<th>PTS</th>
</tr>

</tr>

<tr>

</tr>

<tr>

</tr>

<tr>
<td>🇿🇦 Sudáfrica</td>
<td>2</td>
<td>1</td>
</tr>

</table>
</div>

<div class="grupo">
<h2>Grupo B</h2>

<table>
<tr>
<th>Selección</th>
<th>PJ</th>
<th>PTS</th>
</tr>

<tr>

</tr>

</table>
</div>

</div>

</body>
</html>
